{% extends 'base.html' %}

{% block content %}

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <h1 class="fw-bold text-center mb-4">
                Contact Us
            </h1>

            <p class="text-center text-muted mb-5">
                Have a question, suggestion, or feedback?
                We'd love to hear from you.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter your name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Message
                    </label>

                    <textarea name="message"
                              class="form-control"
                              rows="5"
                              placeholder="Write your message..."
                              required></textarea>
                </div>

                <button type="submit"
                        class="btn btn-danger w-100">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
