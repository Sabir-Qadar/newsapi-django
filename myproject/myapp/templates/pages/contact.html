<div class="container my-5">

    <h1 class="text-center mb-5">
        Contact Us

    <div class="row">

        <div class="col-lg-6">

            <form>

                <input class="form-control mb-3" placeholder="Full Name">

                <input class="form-control mb-3" placeholder="Email">

                <input class="form-control mb-3" placeholder="Subject">

            </form>

        </div>

        <div class="col-lg-6">

            <img src="https://placehold.co/600x500" class="img-fluid rounded">

        </div>
